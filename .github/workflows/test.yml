name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # jest-junit (configured in jest.config.js) writes reports/jest-junit.xml.
      # if: always() so a summary appears even when tests fail. ubuntu-latest
      # ships python3 by default, no setup step needed.
      - name: Test summary
        if: always()
        run: python3 .github/scripts/summarize_junit.py "reports/jest-junit.xml"
